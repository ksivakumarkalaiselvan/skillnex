<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Intelligence — SKILLNEX AI</title>
    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SKILLNEX">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pwa.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar Header -->
            <div id="topbar-container"></div>

            <div id="skills-grid-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;">
                <!-- Populated dynamically by JS -->
            </div>

        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/pwa-installer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Skills.init();
        });
    </script>

</html>
